[package]
name = "companion-app"
description = "Syno Companion: desktop companion for Synology NAS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "syno-companion"

[[bin]]
name = "syno-companion"
path = "src/main.rs"

[features]
# Enabled by `tauri build`: serve the bundled UI instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
companion-discovery = { path = "../companion-discovery" }
companion-dsm = { path = "../companion-dsm" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

# The system keychain: Secret Service (GNOME Keyring, KWallet), macOS Keychain,
# Windows Credential Manager. The Linux backend is pure Rust, so builds need no libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
